
name: Build FAH CLIENT APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract ZIP
        run: |
          set -eux
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: ไม่พบไฟล์ ZIP ในหน้าแรกของ Repository"
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          find extracted -name settings.gradle.kts -o -name settings.gradle

      - name: Find Android project
        run: |
          set -eux
          SETTINGS="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ZIP ไม่มีไฟล์ settings.gradle หรือ settings.gradle.kts"
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          set -eux
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAH-CLIENT-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
