name: Build FAH CLIENT APK from ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'FAH_CLIENT_Android_Phone_Build.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f FAH_CLIENT_Android_Phone_Build.zip
          mkdir -p extracted
          unzip -o FAH_CLIENT_Android_Phone_Build.zip -d extracted
          find extracted -name settings.gradle.kts -print -quit | grep .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAH-CLIENT-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
